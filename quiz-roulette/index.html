<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minigame — Thành tựu văn minh Ấn Độ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <!-- START -->
  <div class="screen active" id="screen-start">
    <img src="assets/img/image3.png" class="deco-left" alt="">
    <img src="assets/img/image1.png" class="deco-right" alt="">
    <div class="start-content">
      <h1 class="game-title">Minigame</h1>
      <p class="game-sub">TỔ 2 - LỚP 10/2</p>
      <p class="game-topic">Tìm hiểu về thành tựu văn minh Ấn Độ</p>
      <button class="btn btn-start" id="btn-start">BẮT ĐẦU</button>
    </div>
    <button class="corner-btn" id="audio-toggle" title="Âm thanh">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </button>
  </div>

  <!-- QUESTION WHEEL -->
  <div class="screen" id="screen-wheel">
    <button class="corner-btn" id="audio-toggle-w" title="Âm thanh">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </button>
    <div class="chip chip-question">Vòng quay câu hỏi</div>
    <div class="wheel-assembly">
      <div class="wheel-pointer"></div>
      <div id="q-wheel-container" class="wheel-container"></div>
      <div class="wheel-hub"><span>?</span></div>
    </div>
    <div class="spin-result" id="spin-result"></div>
    <div class="wheel-actions">
      <button class="btn btn-spin" id="btn-spin-q">QUAY</button>
      <button class="btn btn-continue" id="btn-open-q" hidden>MỞ CÂU HỎI</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <button class="corner-btn" id="audio-toggle-q" title="Âm thanh">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </button>
    <button class="circle-btn" id="home-btn" title="Về vòng quay">
      <img src="assets/img/image30.svg" alt="Home">
    </button>
    <div class="quiz-content">
      <div class="quiz-panel">
        <div class="quiz-chip" id="quiz-chip">CÂU HỎI</div>
        <div class="quiz-progress" id="quiz-progress"></div>
        <div class="quiz-question" id="quiz-question"></div>
      </div>
      <div class="quiz-options" id="quiz-options"></div>
      <div class="quiz-explain" id="quiz-explain"></div>
    </div>
    <button class="btn btn-next" id="btn-next" hidden>TIẾP TỤC</button>
  </div>

  <!-- PRIZE WHEEL -->
  <div class="screen" id="screen-prize">
    <button class="corner-btn" id="audio-toggle-p" title="Âm thanh">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </button>
    <div class="chip chip-prize">Vòng quay phần thưởng</div>
    <div class="wheel-assembly">
      <div class="wheel-pointer"></div>
      <div id="prize-wheel-container" class="wheel-container"></div>
      <div class="wheel-hub hub-prize"><span>THƯỞNG</span></div>
    </div>
    <div class="prize-overlay" id="prize-overlay">
      <div class="prize-result-box">
        <div class="prize-result-label">Bạn nhận được:</div>
        <div class="prize-result-name" id="prize-result-text"></div>
        <button class="btn btn-continue" id="btn-prize-next">TIẾP TỤC</button>
      </div>
    </div>
    <button class="btn btn-spin" id="btn-spin-prize">QUAY PHẦN THƯỞNG</button>
  </div>

  <!-- END -->
  <div class="screen" id="screen-end">
    <h1 class="end-title">Hết câu hỏi!</h1>
    <p class="end-summary" id="end-summary"></p>
    <button class="btn btn-replay" id="btn-replay">CHƠI LẠI</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
